<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display 1 - Core do Avatar (Pré-carregamento RAM Zero Latency)</title>
    <style>
        * { box-sizing: border-box; }
        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background: transparent;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #avatar-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: calc(100vh * (9 / 16));
            max-height: calc(100vw * (16 / 9));
            display: flex;
            justify-content: center;
            align-items: center;
            transform: scale(1);
            transition: transform 0.3s ease;
        }

        .avatar-video {
            display: none;
        }

        #chroma-canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #loading-screen {
            position: absolute;
            color: #00ffcc;
            font-family: Arial, sans-serif;
            font-weight: bold;
            font-size: 1.2rem;
            background: rgba(0,0,0,0.8);
            padding: 20px;
            border-radius: 8px;
            z-index: 99;
        }
    </style>
</head>
<body>

    <div id="loading-screen">A carregar assets para a RAM...</div>

    <div id="avatar-container">
        <video id="video-a" class="avatar-video" autoplay muted playsinline crossorigin="anonymous"></video>
        <video id="video-b" class="avatar-video" autoplay muted playsinline crossorigin="anonymous"></video>
        <canvas id="chroma-canvas"></canvas>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const canvas = document.getElementById('chroma-canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const container = document.getElementById('avatar-container');
        const loadingScreen = document.getElementById('loading-screen');

        let videoA = document.getElementById('video-a');
        let videoB = document.getElementById('video-b');
        let activeVideo = videoA;
        let nextVideo = videoB;
        let animationFrameId = null;

        // Cache local em memória RAM (Blob URLs)
        const videoCache = {};
        const talkingFiles = ['talking02.mp4', 'talking04.mp4', 'talking05.mp4', 'talking06.mp4'];

        // Pré-carrega todos os vídeos essenciais para a RAM do navegador ao abrir a página
        async function preloadAllAssets() {
            for (let file of talkingFiles) {
                try {
                    let response = await fetch(`/assets/${file}`);
                    let blob = await response.blob();
                    videoCache[file] = URL.createObjectURL(blob);
                } catch (e) {
                    console.error(`Erro ao pré-carregar ${file}:`, e);
                }
            }
            loadingScreen.style.display = 'none';
            console.log("Todos os vídeos carregados para a memória RAM com sucesso!");
        }

        preloadAllAssets();

        function processFrame() {
            if (activeVideo.paused || activeVideo.ended) return;

            if (canvas.width !== activeVideo.videoWidth || canvas.height !== activeVideo.videoHeight) {
                canvas.width = activeVideo.videoWidth || 720;
                canvas.height = activeVideo.videoHeight || 1280;
            }

            ctx.drawImage(activeVideo, 0, 0, canvas.width, canvas.height);
            let frame = ctx.getImageData(0, 0, canvas.width, canvas.height);
            let data = frame.data;

            // Chroma Key limpo por pixel (remove o fundo verde)
            for (let i = 0; i < data.length; i += 4) {
                let red = data[i];
                let green = data[i + 1];
                let blue = data[i + 2];

                if (green > 75 && green > red * 1.12 && green > blue * 1.12) {
                    data[i + 3] = 0; // Transparente absoluto
                }
            }

            ctx.putImageData(frame, 0, 0);
            animationFrameId = requestAnimationFrame(processFrame);
        }

        activeVideo.addEventListener('play', () => {
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            processFrame();
        });

        // Recebe comandos do Painel de Controlo
        socket.on('update-avatar', (data) => {
            if (data.video) {
                // Usa o blob da RAM se existir, senão faz fallback para o caminho normal
                const targetSrc = videoCache[data.video] || `/assets/${data.video}`;
                
                nextVideo.src = targetSrc;
                nextVideo.load();
                
                nextVideo.oncanplaythrough = () => {
                    nextVideo.oncanplaythrough = null;
                    switchBuffers();
                };
                
                // Fallback imediato caso o evento demore
                setTimeout(switchBuffers, 50);
            }

            if (data.scale) {
                container.style.transform = `scale(${data.scale})`;
            }
        });

        function switchBuffers() {
            nextVideo.play().then(() => {
                activeVideo.pause();
                
                let temp = activeVideo;
                activeVideo = nextVideo;
                nextVideo = temp;

                if (animationFrameId) cancelAnimationFrame(animationFrameId);
                processFrame();

                // Envia o sinal para medir a latência real no painel
                socket.emit('sensor-ack');
            }).catch(err => console.log("Aguardando buffer:", err));
        }
    </script>
</body>
</html>
