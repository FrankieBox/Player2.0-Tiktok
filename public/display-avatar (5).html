<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display Avatar - TikTok Shop</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: transparent;
        }
        
        #canvas-container {
            position: absolute;
            /* Posição inicial no canto inferior direito */
            bottom: 20px;
            right: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            touch-action: none; /* Impede o scroll da página ao tocar no avatar */
            cursor: grab;
            transition: width 0.3s ease, height 0.3s ease;
        }

        #canvas-container:active {
            cursor: grabbing;
        }

        /* Modos de Escala do Avatar Inteiro (PIP) */
        .escala-full {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            bottom: auto !important;
            right: auto !important;
        }

        .escala-pip-medio {
            width: 40vw;
            height: 70vh;
        }

        .escala-pip-pequeno {
            width: 25vw;
            height: 45vh;
        }

        canvas {
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none; /* Permite que o toque passe direto para o container */
        }
        
        video {
            display: none;
        }
    </style>
</head>
<body>

    <div id="canvas-container" class="escala-full">
        <canvas id="avatarCanvas"></canvas>
    </div>

    <video id="videoA" muted playsinline crossorigin="anonymous"></video>
    <video id="videoB" muted playsinline crossorigin="anonymous"></video>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const canvas = document.getElementById('avatarCanvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const container = document.getElementById('canvas-container');
        
        const videoA = document.getElementById('videoA');
        const videoB = document.getElementById('videoB');
        
        let activeVideo = videoA;
        let nextVideo = videoB;
        let animationFrameId = null;
        let loadStartTime = 0;

        const videoCache = {};
        const totalTalkingVideos = 11;

        // Variáveis para controlar o arrastar com o dedo / rato (Drag & Drop)
        let isDragging = false;
        let startX, startY;

        container.addEventListener('pointerdown', (e) => {
            // Só permite arrastar se estiver em modo PIP (não em Fullscreen)
            if (container.classList.contains('escala-full')) return;
            
            isDragging = true;
            startX = e.clientX - container.offsetLeft;
            startY = e.clientY - container.offsetTop;
            container.setPointerCapture(e.pointerId);
        });

        container.addEventListener('pointermove', (e) => {
            if (!isDragging) return;
            
            let newX = e.clientX - startX;
            let newY = e.clientY - startY;

            // Remove o bottom/right fixos para posicionar via left/top livres
            container.style.bottom = 'auto';
            container.style.right = 'auto';
            container.style.left = `${newX}px`;
            container.style.top = `${newY}px`;
        });

        container.addEventListener('pointerup', (e) => {
            isDragging = false;
            try { container.releasePointerCapture(e.pointerId); } catch(err) {}
        });

        function resizeCanvas() {
            canvas.width = 1080;
            canvas.height = 1920;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        async function preloadAllVideos() {
            for (let i = 1; i <= totalTalkingVideos; i++) {
                const numStr = i < 10 ? '0' + i : i;
                const fileName = `talking${numStr}.mp4`;
                try {
                    const response = await fetch(`/assets/${fileName}`);
                    const blob = await response.blob();
                    videoCache[fileName] = URL.createObjectURL(blob);
                } catch (e) {
                    console.error(`Erro ao carregar ${fileName}:`, e);
                }
            }
            console.log("[RAM Cache] Todos os takes carregados com sucesso!");
        }

        function processFrame() {
            if (!activeVideo.paused && !activeVideo.ended) {
                ctx.drawImage(activeVideo, 0, 0, canvas.width, canvas.height);
                
                let frame = ctx.getImageData(0, 0, canvas.width, canvas.height);
                let l = frame.data.length;

                for (let i = 0; i < l; i += 4) {
                    let r = frame.data[i];
                    let g = frame.data[i + 1];
                    let b = frame.data[i + 2];

                    if (g > 90 && g > r * 1.2 && g > b * 1.2) {
                        frame.data[i + 3] = 0;
                    }
                }
                ctx.putImageData(frame, 0, 0);
            }
            animationFrameId = requestAnimationFrame(processFrame);
        }

        async function playVideoFile(fileName) {
            const videoUrl = videoCache[fileName] || `/assets/${fileName}`;
            loadStartTime = performance.now();

            nextVideo.src = videoUrl;
            await nextVideo.load();

            try {
                await nextVideo.play();
                
                let temp = activeVideo;
                activeVideo = nextVideo;
                nextVideo = temp;

                nextVideo.pause();

                const latency = Math.round(performance.now() - loadStartTime);
                socket.emit('video-switched', { fileName, latency });

            } catch (err) {
                console.error("Erro ao reproduzir:", err);
            }
        }

        videoA.onended = () => socket.emit('video-ended');
        videoB.onended = () => socket.emit('video-ended');

        socket.on('play-video', (fileName) => {
            playVideoFile(fileName);
        });

        socket.on('change-scale', (scaleClass) => {
            container.className = "";
            container.classList.add(scaleClass);
            
            // Se voltar para Ecrã Inteiro, limpa as posições livres de arrastar
            if (scaleClass === 'escala-full') {
                container.style.left = '';
                container.style.top = '';
                container.style.bottom = '';
                container.style.right = '';
            } else {
                // Se for PIP, coloca numa posição padrão inicial (canto inferior direito)
                container.style.bottom = '20px';
                container.style.right = '20px';
                container.style.left = 'auto';
                container.style.top = 'auto';
            }
        });

        window.addEventListener('load', async () => {
            await preloadAllVideos();
            if (videoCache['talking01.mp4']) {
                videoA.src = videoCache['talking01.mp4'];
                await videoA.load();
                await videoA.play();
                processFrame();
            }
        });
    </script>
</body>
</html>
