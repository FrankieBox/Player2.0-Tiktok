<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display 1 - Avatar Chroma Key Real (9:16)</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background: transparent; /* Fundo totalmente transparente */
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #avatar-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: calc(100vh * (9 / 16));
            max-height: calc(100vw * (16 / 9));
            display: flex;
            justify-content: center;
            align-items: center;
            transform: scale(1);
            transition: transform 0.3s ease;
        }

        /* O vídeo fica oculto, servindo apenas como fonte de dados para o motor de chroma key */
        #avatar-video {
            display: none;
        }

        /* O Canvas exibe o resultado final com o verde removido em tempo real */
        #chroma-canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <div id="avatar-container">
        <!-- Vídeo de origem oculto -->
        <video id="avatar-video" autoplay muted playsinline crossorigin="anonymous"></video>
        <!-- Canvas onde o Chroma Key é processado pixel a pixel -->
        <canvas id="chroma-canvas"></canvas>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const video = document.getElementById('avatar-video');
        const canvas = document.getElementById('chroma-canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const container = document.getElementById('avatar-container');

        let animationFrameId = null;

        // Função de processamento de Chroma Key por frame
        function processFrame() {
            if (video.paused || video.ended) {
                return;
            }

            // Sincroniza as dimensões do canvas com o vídeo real
            if (canvas.width !== video.videoWidth || canvas.height !== video.videoHeight) {
                canvas.width = video.videoWidth || 720;
                canvas.height = video.videoHeight || 1280;
            }

            // Desenha o frame atual do vídeo no canvas
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            let frame = ctx.getImageData(0, 0, canvas.width, canvas.height);
            let l = frame.data.length;

            // Varredura de pixels para remover o fundo verde
            for (let i = 0; i < l; i += 4) {
                let red = frame.data[i];
                let green = frame.data[i + 1];
                let blue = frame.data[i + 2];

                // Condição de deteção do verde típico de fundo de IA (verde dominante)
                if (green > 90 && green > red * 1.2 && green > blue * 1.2) {
                    frame.data[i + 3] = 0; // Torna o pixel totalmente transparente (Alpha = 0)
                }
            }

            ctx.putImageData(frame, 0, 0);
            animationFrameId = requestAnimationFrame(processFrame);
        }

        video.addEventListener('play', () => {
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            processFrame();
        });

        // Recebe comandos do Painel de Controlo 1
        socket.on('update-avatar', (data) => {
            if (data.video) {
                video.src = `/assets/${data.video}`;
                video.play().catch(err => console.log("Aguardando interação:", err));
            }
            if (data.scale) {
                container.style.transform = `scale(${data.scale})`;
            }
        });
    </script>
</body>
</html>
