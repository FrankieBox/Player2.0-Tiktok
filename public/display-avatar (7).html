<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display Avatar - Mobile Streaming Pro</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: transparent !important;
        }
        
        #status-indicator {
            position: fixed;
            top: 10px;
            left: 10px;
            width: 12px;
            height: 12px;
            background-color: #ff3366;
            border-radius: 50%;
            z-index: 9999;
            box-shadow: 0 0 8px #ff3366;
        }
        #status-indicator.connected {
            background-color: #00ffcc;
            box-shadow: 0 0 8px #00ffcc;
        }

        #canvas-container {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            touch-action: none;
            cursor: grab;
            transition: width 0.3s ease, height 0.3s ease;
            width: 40vw;
            height: 70vh;
        }

        #canvas-container:active {
            cursor: grabbing;
        }

        .escala-full {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            bottom: auto !important;
            right: auto !important;
        }

        .escala-pip-medio { width: 40vw; height: 70vh; }
        .escala-pip-pequeno { width: 25vw; height: 45vh; }

        canvas {
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
            background-color: transparent;
        }
        
        video, audio { display: none; }
    </style>
</head>
<body>

    <div id="status-indicator" title="Estado da Conexão"></div>

    <div id="canvas-container" class="escala-full">
        <canvas id="avatarCanvas"></canvas>
    </div>

    <!-- Motores de Vídeo para o Avatar -->
    <video id="videoA" muted playsinline crossorigin="anonymous"></video>
    <video id="videoB" muted playsinline crossorigin="anonymous"></video>
    
    <!-- Player de Áudio Otimizado com Suporte a Longas Durações (Streaming Direto) -->
    <audio id="audioPlayer" preload="auto" crossorigin="anonymous"></audio>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const indicator = document.getElementById('status-indicator');
        
        socket.on('connect', () => indicator.classList.add('connected'));
        socket.on('disconnect', () => indicator.classList.remove('connected'));

        const canvas = document.getElementById('avatarCanvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const container = document.getElementById('canvas-container');
        
        const videoA = document.getElementById('videoA');
        const videoB = document.getElementById('videoB');
        const audioPlayer = document.getElementById('audioPlayer');
        
        let activeVideo = videoA;
        let nextVideo = videoB;
        let loadStartTime = 0;
        const videoCache = {};
        const totalTalkingVideos = 11;

        let isDragging = false;
        let startX, startY;

        // REGISTRO DA MEDIA SESSION API (O Segredo do "Efeito Spotify" no Mobile)
        function initMediaSession() {
            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: 'Live TikTok Shop - Avatar',
                    artist: 'Estúdio Mobile Autônomo',
                    album: 'Transmissão Ao Vivo'
                });

                navigator.mediaSession.setActionHandler('play', async () => {
                    await audioPlayer.play();
                });
                navigator.mediaSession.setActionHandler('pause', () => {
                    audioPlayer.pause();
                });
            }
        }

        // Desbloqueio universal e registo de sessão no primeiro toque na tela
        function globalMobileUnlock() {
            initMediaSession();
            if (audioPlayer.paused) {
                audioPlayer.src = "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=";
                audioPlayer.play().then(() => {
                    audioPlayer.pause();
                    console.log("[MediaSession] Contexto de áudio móvel autorizado com sucesso.");
                }).catch(e => {});
            }
        }
        window.addEventListener('pointerdown', globalMobileUnlock, { once: true });

        // Controlo de Arrastar o PIP na Tela
        container.addEventListener('pointerdown', (e) => {
            if (container.classList.contains('escala-full')) return;
            isDragging = true;
            startX = e.clientX - container.offsetLeft;
            startY = e.clientY - container.offsetTop;
            container.setPointerCapture(e.pointerId);
        });

        container.addEventListener('pointermove', (e) => {
            if (!isDragging) return;
            let newX = e.clientX - startX;
            let newY = e.clientY - startY;
            container.style.bottom = 'auto';
            container.style.right = 'auto';
            container.style.left = `${newX}px`;
            container.style.top = `${newY}px`;
        });

        container.addEventListener('pointerup', (e) => {
            isDragging = false;
            try { container.releasePointerCapture(e.pointerId); } catch(err) {}
        });

        function resizeCanvas() {
            canvas.width = 1080;
            canvas.height = 1920;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Pré-carregamento dos vídeos do avatar para cache local (Zero Latência)
        async function preloadAllVideos() {
            for (let i = 1; i <= totalTalkingVideos; i++) {
                const numStr = i < 10 ? '0' + i : i;
                const fileName = `talking${numStr}.mp4`;
                try {
                    const response = await fetch(`/assets/${fileName}`);
                    const blob = await response.blob();
                    videoCache[fileName] = URL.createObjectURL(blob);
                } catch (e) {}
            }
        }

        // Renderizador de Chroma Key em Tempo Real
        function processFrame() {
            if (!activeVideo.paused && !activeVideo.ended) {
                ctx.drawImage(activeVideo, 0, 0, canvas.width, canvas.height);
                let frame = ctx.getImageData(0, 0, canvas.width, canvas.height);
                let l = frame.data.length;

                for (let i = 0; i < l; i += 4) {
                    let r = frame.data[i];
                    let g = frame.data[i + 1];
                    let b = frame.data[i + 2];

                    if (g > 90 && g > r * 1.2 && g > b * 1.2) {
                        frame.data[i + 3] = 0;
                    }
                }
                ctx.putImageData(frame, 0, 0);
            }
            requestAnimationFrame(processFrame);
        }

        async function playVideoFile(fileName) {
            const videoUrl = videoCache[fileName] || `/assets/${fileName}`;
            loadStartTime = performance.now();
            nextVideo.src = videoUrl;
            await nextVideo.load();

            try {
                await nextVideo.play();
                let temp = activeVideo;
                activeVideo = nextVideo;
                nextVideo = temp;
                nextVideo.pause();

                const latency = Math.round(performance.now() - loadStartTime);
                socket.emit('video-switched', { fileName, latency });
            } catch (err) {}
        }

        videoA.onended = () => socket.emit('video-ended');
        videoB.onended = () => socket.emit('video-ended');

        socket.on('play-video', (fileName) => playVideoFile(fileName));

        socket.on('change-scale', (scaleClass) => {
            container.className = "";
            container.classList.add(scaleClass);
            if (scaleClass === 'escala-full') {
                container.style.left = '';
                container.style.top = '';
                container.style.bottom = '';
                container.style.right = '';
            } else {
                container.style.bottom = '20px';
                container.style.right = '20px';
                container.style.left = 'auto';
                container.style.top = 'auto';
            }
        });

        // REPRODUÇÃO DE ÁUDIO OTIMIZADA PARA CURTOS E LONGOS FORMATOS (1+ HORA)
        socket.on('play-audio', (audioData) => {
            audioPlayer.src = audioData.url;
            audioPlayer.currentTime = 0;
            audioPlayer.play().then(() => {
                console.log("[Streaming de Áudio] A reproduzir:", audioData.name);
            }).catch(err => {
                console.error("[Streaming de Áudio] Erro na reprodução:", err);
            });
        });

        window.addEventListener('load', async () => {
            await preloadAllVideos();
            if (videoCache['talking01.mp4']) {
                videoA.src = videoCache['talking01.mp4'];
                await videoA.load();
                await videoA.play();
                processFrame();
            }
        });
    </script>
</body>
</html>
