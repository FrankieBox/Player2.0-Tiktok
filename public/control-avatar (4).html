<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Controlo - Avatar TikTok Shop</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background-color: #121212; 
            color: #ffffff; 
            margin: 0; 
            padding: 20px; 
        }
        h1 { font-size: 22px; color: #00ffcc; text-align: center; }
        .monitor-box { 
            background: #1e1e1e; 
            border: 2px solid #00ffcc; 
            padding: 15px; 
            border-radius: 8px; 
            margin-bottom: 20px; 
            text-align: center; 
        }
        .action-btn { 
            background-color: #ff3366; 
            color: white; 
            border: none; 
            padding: 15px; 
            font-size: 16px; 
            border-radius: 6px; 
            cursor: pointer; 
            width: 100%; 
            font-weight: bold; 
            margin-bottom: 15px; 
            transition: 0.2s;
        }
        .action-btn.active { background-color: #00cc66; }
        
        /* Secção de Controlo de Molduras */
        .moldura-box {
            background: #1e1e1e;
            border: 1px solid #ffcc00;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .moldura-box h3 {
            margin-top: 0;
            font-size: 16px;
            color: #ffcc00;
            text-align: center;
        }
        .moldura-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }
        .moldura-btn {
            background-color: #2a2a2a;
            color: white;
            border: 1px solid #ffcc00;
            padding: 10px;
            font-size: 13px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        .moldura-btn:hover { background-color: #ffcc00; color: #000; }

        details { 
            background: #1e1e1e; 
            border: 1px solid #444; 
            border-radius: 8px; 
            padding: 15px; 
            margin-bottom: 20px; 
        }
        summary { font-size: 16px; font-weight: bold; color: #ffcc00; cursor: pointer; }
        .takes-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 15px; }
        .take-btn { background-color: #2a2a2a; color: white; border: 1px solid #555; padding: 12px; font-size: 14px; border-radius: 6px; cursor: pointer; }
        .take-btn:hover { background-color: #00ffcc; color: #000; font-weight: bold; }
    </style>
</head>
<body>

    <h1>Painel de Controlo - Avatar Autónomo</h1>

    <!-- Monitor de Fila e Latência -->
    <div class="monitor-box">
        <p><strong>A a Rodar:</strong> <span id="current-playing" style="color: #00ffcc;">Nenhum</span></p>
        <p><strong>Próximo na Fila:</strong> <span id="next-queue" style="color: #ffcc00;">Aguardando...</span></p>
        <p><strong>Latência de Transição:</strong> <span id="latency-display" style="color: #ff3366;">0 ms</span></p>
    </div>

    <!-- Botão Principal de Auto-Live -->
    <button id="btn-autolive" class="action-btn" onclick="toggleAutoLive()">🟢 Ligar Auto-Live (Talking Contínuo)</button>

    <!-- Controlo de Molduras e Layouts do Avatar -->
    <div class="moldura-box">
        <h3>🖼️ Seleção de Moldura / Layout</h3>
        <div class="moldura-grid">
            <button class="moldura-btn" onclick="changeMoldura('moldura-fullscreen')">Ecrã Inteiro</button>
            <button class="moldura-btn" onclick="changeMoldura('moldura-circulo')">Círculo (PIP)</button>
            <button class="moldura-btn" onclick="changeMoldura('moldura-quadrada')">Card Vertical</button>
        </div>
    </div>

    <!-- Menu Retrátil para Teste Individual dos Takes -->
    <details>
        <summary>📁 Gestão e Teste Individual de Takes (01 a 11)</summary>
        <div class="takes-grid" id="takes-container"></div>
    </details>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let autoLiveActive = false;

        const talkingFiles = [
            'talking01.mp4', 'talking02.mp4', 'talking03.mp4', 'talking04.mp4',
            'talking05.mp4', 'talking06.mp4', 'talking07.mp4', 'talking08.mp4',
            'talking09.mp4', 'talking10.mp4', 'talking11.mp4'
        ];

        let queue = [];

        // Gerar os botões dos takes dinamicamente
        const container = document.getElementById('takes-container');
        talkingFiles.forEach((file, index) => {
            const num = index + 1;
            const btn = document.createElement('button');
            btn.className = 'take-btn';
            btn.innerText = `Take ${num < 10 ? '0' + num : num}`;
            btn.onclick = () => playManual(file);
            container.appendChild(btn);
        });

        function shuffleQueue() {
            queue = [...talkingFiles].sort(() => Math.random() - 0.5);
        }

        function playManual(filename) {
            socket.emit('trigger-video', filename);
            document.getElementById('current-playing').innerText = filename + " (Manual)";
        }

        function changeMoldura(molduraClass) {
            socket.emit('change-moldura', molduraClass);
            console.log("Comando enviado para alterar moldura:", molduraClass);
        }

        function toggleAutoLive() {
            autoLiveActive = !autoLiveActive;
            const btn = document.getElementById('btn-autolive');

            if (autoLiveActive) {
                btn.classList.add('active');
                btn.innerText = "🔴 Desligar Auto-Live";
                shuffleQueue();
                runAutoLiveLoop();
            } else {
                btn.classList.remove('active');
                btn.innerText = "🟢 Ligar Auto-Live (Talking Contínuo)";
                document.getElementById('next-queue').innerText = "Pausado";
            }
        }

        function runAutoLiveLoop() {
            if (!autoLiveActive) return;
            if (queue.length === 0) shuffleQueue();

            const nextFile = queue.shift();
            const upcomingFile = queue[0] || talkingFiles[0];

            socket.emit('trigger-video', nextFile);
            document.getElementById('current-playing').innerText = nextFile;
            document.getElementById('next-queue').innerText = upcomingFile;
        }

        // Avança na fila quando o display avisa que o take atual terminou
        socket.on('next-auto-video', () => {
            if (autoLiveActive) {
                runAutoLiveLoop();
            }
        });

        socket.on('video-switched-ack', (data) => {
            document.getElementById('latency-display').innerText = data.latency + " ms";
        });
    </script>
</body>
</html>
