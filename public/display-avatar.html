<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display Avatar - TikTok Shop</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: transparent; /* Fundo transparente para overlays */
        }
        
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
        }

        /* Classes de Molduras e Estilos do Avatar */
        .moldura-fullscreen {
            width: 100vw;
            height: 100vh;
            border-radius: 0px;
            border: none;
        }

        .moldura-circulo {
            width: 450px;
            height: 450px;
            border-radius: 50%;
            border: 4px solid #00ffcc;
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.6);
            overflow: hidden;
        }

        .moldura-quadrada {
            width: 450px;
            height: 800px;
            border-radius: 16px;
            border: 3px solid #ff3366;
            box-shadow: 0 0 25px rgba(255, 51, 102, 0.6);
            overflow: hidden;
        }

        canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        video {
            display: none;
        }
    </style>
</head>
<body>

    <!-- Container do Avatar com suporte a molduras dinâmicas -->
    <div id="canvas-container" class="moldura-fullscreen">
        <canvas id="avatarCanvas"></canvas>
    </div>

    <!-- Motores de Vídeo em Duplo Buffer -->
    <video id="videoA" muted playsinline crossorigin="anonymous"></video>
    <video id="videoB" muted playsinline crossorigin="anonymous"></video>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const canvas = document.getElementById('avatarCanvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const container = document.getElementById('canvas-container');
        
        const videoA = document.getElementById('videoA');
        const videoB = document.getElementById('videoB');
        
        let activeVideo = videoA;
        let nextVideo = videoB;
        let animationFrameId = null;
        let loadStartTime = 0;

        const videoCache = {};
        const totalTalkingVideos = 11;

        function resizeCanvas() {
            canvas.width = 1080;
            canvas.height = 1920;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Pré-carregamento em memória RAM (Blob URLs)
        async function preloadAllVideos() {
            for (let i = 1; i <= totalTalkingVideos; i++) {
                const numStr = i < 10 ? '0' + i : i;
                const fileName = `talking${numStr}.mp4`;
                try {
                    const response = await fetch(`/assets/${fileName}`);
                    const blob = await response.blob();
                    videoCache[fileName] = URL.createObjectURL(blob);
                } catch (e) {
                    console.error(`Erro ao carregar ${fileName}:`, e);
                }
            }
            console.log("[RAM Cache] Todos os takes carregados com sucesso!");
        }

        // Motor de Chroma Key em Tempo Real
        function processFrame() {
            if (!activeVideo.paused && !activeVideo.ended) {
                ctx.drawImage(activeVideo, 0, 0, canvas.width, canvas.height);
                
                let frame = ctx.getImageData(0, 0, canvas.width, canvas.height);
                let l = frame.data.length;

                for (let i = 0; i < l; i += 4) {
                    let r = frame.data[i];
                    let g = frame.data[i + 1];
                    let b = frame.data[i + 2];

                    if (g > 90 && g > r * 1.2 && g > b * 1.2) {
                        frame.data[i + 3] = 0; // Transparência absoluta
                    }
                }
                ctx.putImageData(frame, 0, 0);
            }
            animationFrameId = requestAnimationFrame(processFrame);
        }

        // Reprodução com buffer duplo
        async function playVideoFile(fileName) {
            const videoUrl = videoCache[fileName] || `/assets/${fileName}`;
            loadStartTime = performance.now();

            nextVideo.src = videoUrl;
            await nextVideo.load();

            try {
                await nextVideo.play();
                
                let temp = activeVideo;
                activeVideo = nextVideo;
                nextVideo = temp;

                nextVideo.pause();

                const latency = Math.round(performance.now() - loadStartTime);
                socket.emit('video-switched', { fileName, latency });

            } catch (err) {
                console.error("Erro ao reproduzir:", err);
            }
        }

        // Eventos de término de vídeo
        videoA.onended = () => socket.emit('video-ended');
        videoB.onended = () => socket.emit('video-ended');

        // Recebe comandos de vídeo do Painel
        socket.on('play-video', (fileName) => {
            playVideoFile(fileName);
        });

        // Recebe comandos de mudança de moldura/layout do Painel
        socket.on('change-moldura', (molduraClass) => {
            container.className = ""; // Limpa classes anteriores
            container.classList.add(molduraClass);
            console.log("[Layout] Moldura alterada para:", molduraClass);
        });

        window.addEventListener('load', async () => {
            await preloadAllVideos();
            if (videoCache['talking01.mp4']) {
                videoA.src = videoCache['talking01.mp4'];
                await videoA.load();
                await videoA.play();
                processFrame();
            }
        });
    </script>
</body>
</html>
