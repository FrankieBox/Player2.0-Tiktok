<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Display 1 - Core do Avatar</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background: transparent; /* Permite sobreposição limpa */
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: flex-end; /* Alinha o avatar na base da tela */
        }

        #avatar-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            transition: transform 0.3s ease; /* Transição suave para zoom/escala */
        }

        video {
            max-height: 90vh;
            width: auto;
            /* Nota: O Chroma Key (remoção do verde) pode ser feito via hardware do vídeo transparente 
               ou via filtros CSS/Canvas caso utilize MP4 com fundo verde sólido. */
        }
    </style>
</head>
<body>

    <div id="avatar-container" style="transform: scale(1);">
        <video id="avatar-video" autoplay muted playsinline></video>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const videoElement = document.getElementById('avatar-video');
        const container = document.getElementById('avatar-container');

        // Recebe comandos do Painel de Controlo 1
        socket.on('update-avatar', (data) => {
            if (data.video) {
                videoElement.src = `/assets/${data.video}`;
                videoElement.play().catch(e => console.log("Erro ao reproduzir:", e));
            }
            if (data.scale) {
                container.style.transform = `scale(${data.scale})`;
            }
        });

        // Loop automático preventivo caso o vídeo termine
        videoElement.addEventListener('ended', () => {
            // Pede ao servidor ou repete o estado idle por segurança
        });
    </script>
</body>
</html>
