<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display 1 - Core do Avatar (9:16)</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background: transparent; /* Fundo transparente para live / OBS / WebRTC */
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Contentor principal forçado estritamente no formato 9:16 */
        #avatar-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: calc(100vh * (9 / 16)); /* Mantém estritamente a proporção 9:16 */
            max-height: calc(100vw * (16 / 9));
            display: flex;
            justify-content: center;
            align-items: center;
            transform: scale(1);
            transition: transform 0.3s ease;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Cobre todo o espaço 9:16 sem distorcer as proporções */
        }
    </style>
</head>
<body>

    <div id="avatar-container">
        <div class="video-wrapper">
            <!-- Vídeo inicial de idle padrão -->
            <video id="avatar-video" autoplay muted playsinline></video>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const videoElement = document.getElementById('avatar-video');
        const container = document.getElementById('avatar-container');

        // Ouve os comandos exclusivos do Canal 1 (Painel de Controlo 1)
        socket.on('update-avatar', (data) => {
            if (data.video) {
                videoElement.src = `/assets/${data.video}`;
                videoElement.play().catch(err => console.log("Aguardando interação para reproduzir:", err));
            }
            if (data.scale) {
                // Ajuste dinâmico de escala/zoom enviado pelo painel de controlo
                container.style.transform = `scale(${data.scale})`;
            }
        });
    </script>
</body>
</html>
