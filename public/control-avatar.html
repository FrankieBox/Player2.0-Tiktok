<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Controlo - Avatar TikTok Shop</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #ffffff; margin: 0; padding: 20px; }
        h1 { font-size: 22px; color: #00ffcc; text-align: center; }
        .monitor-box { background: #1e1e1e; border: 2px solid #00ffcc; padding: 15px; border-radius: 8px; margin-bottom: 20px; text-align: center; }
        .action-btn { background-color: #ff3366; color: white; border: none; padding: 15px; font-size: 16px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; margin-bottom: 15px; }
        .action-btn.active { background-color: #00cc66; }
        .box-section { background: #1e1e1e; border: 1px solid #ffcc00; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        .box-section h3 { margin-top: 0; font-size: 16px; color: #ffcc00; text-align: center; }
        .pip-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .pip-btn { background-color: #2a2a2a; color: white; border: 1px solid #ffcc00; padding: 10px; font-size: 13px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        input[type="file"] { width: 100%; padding: 10px; background: #2a2a2a; color: #fff; border: 1px dashed #00ffcc; border-radius: 6px; margin-bottom: 10px; box-sizing: border-box; }
        .audio-playlist { max-height: 150px; overflow-y: auto; background: #121212; border: 1px solid #444; border-radius: 6px; padding: 8px; }
        .audio-item { display: flex; justify-content: space-between; align-items: center; padding: 6px 10px; border-bottom: 1px solid #222; font-size: 13px; }
        .audio-item span { color: #00ffcc; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 60%; }
        .play-audio-btn { background: #00cc66; color: #000; border: none; padding: 5px 10px; border-radius: 4px; font-weight: bold; cursor: pointer; }
        details { background: #1e1e1e; border: 1px solid #444; border-radius: 8px; padding: 15px; margin-bottom: 20px; }
        summary { font-size: 16px; font-weight: bold; color: #ffcc00; cursor: pointer; }
        .takes-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 15px; }
        .take-btn { background-color: #2a2a2a; color: white; border: 1px solid #555; padding: 12px; font-size: 14px; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>

    <h1>Painel de Controlo - Avatar Autónomo</h1>

    <div class="monitor-box">
        <p><strong>A Rodar:</strong> <span id="current-playing" style="color: #00ffcc;">Nenhum</span></p>
    </div>

    <div class="box-section">
        <h3>📐 Controlo de Tamanho do Avatar (PIP)</h3>
        <div class="pip-grid">
            <button class="pip-btn" onclick="changeScale('escala-full')">Ecrã Inteiro</button>
            <button class="pip-btn" onclick="changeScale('escala-pip-medio')">PIP Médio</button>
            <button class="pip-btn" onclick="changeScale('escala-pip-pequeno')">PIP Pequeno</button>
        </div>
    </div>

    <div class="box-section">
        <h3>🎙️ Gestor de Roteiros e Fila de Áudio (MP3)</h3>
        <input type="file" id="audioUpload" accept="audio/mp3, audio/mpeg" multiple onchange="handleAudioUpload(this)">
        <div class="audio-playlist" id="audioPlaylistContainer">
            <p style="color: #888; text-align: center; font-size: 13px; margin: 10px 0;">Nenhum áudio carregado.</p>
        </div>
    </div>

    <details>
        <summary>📁 Gestão e Teste Individual de Takes</summary>
        <div class="takes-grid" id="takes-container"></div>
    </details>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let audioPlaylist = [];
        const talkingFiles = ['talking01.mp4', 'talking02.mp4', 'talking03.mp4', 'talking04.mp4', 'talking05.mp4', 'talking06.mp4', 'talking07.mp4', 'talking08.mp4', 'talking09.mp4', 'talking10.mp4', 'talking11.mp4'];

        const container = document.getElementById('takes-container');
        talkingFiles.forEach((file, index) => {
            const num = index + 1;
            const btn = document.createElement('button');
            btn.className = 'take-btn';
            btn.innerText = `Take ${num < 10 ? '0' + num : num}`;
            btn.onclick = () => {
                socket.emit('trigger-video', file);
                document.getElementById('current-playing').innerText = file;
            };
            container.appendChild(btn);
        });

        function changeScale(scaleClass) {
            socket.emit('change-scale', scaleClass);
        }

        function handleAudioUpload(input) {
            const files = input.files;
            if (!files.length) return;
            for (let file of files) {
                audioPlaylist.push({ name: file.name, url: URL.createObjectURL(file) });
            }
            renderPlaylist();
        }

        function renderPlaylist() {
            const container = document.getElementById('audioPlaylistContainer');
            if (!audioPlaylist.length) return;
            container.innerHTML = '';
            audioPlaylist.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'audio-item';
                div.innerHTML = `<span>${item.name}</span><button class="play-audio-btn" onclick="playAudio(${index})">▶ Tocar</button>`;
                container.appendChild(div);
            });
        }

        function playAudio(index) {
            const item = audioPlaylist[index];
            if (item) {
                socket.emit('play-audio-item', { name: item.name, url: item.url });
                document.getElementById('current-playing').innerText = `Áudio: ${item.name}`;
            }
        }
    </script>
</body>
</html>
