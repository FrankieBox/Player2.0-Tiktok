<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Controlo - Canal 1 (Avatar)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #fff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h2 { color: #00ffcc; text-align: center; }
        .section {
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            width: 100%;
            max-width: 400px;
        }
        h3 { font-size: 1rem; color: #38bdf8; margin-top: 0; }
        .btn-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        button {
            background-color: #334155;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover { background-color: #00ffcc; color: #000; }
        button.action-btn { background-color: #6200ee; grid-column: span 2; }
        button.action-btn:hover { background-color: #bb86fc; color: #000; }
        button.auto-btn { background-color: #0d9488; grid-column: span 2; }
        button.auto-btn.active { background-color: #ef4444; }
        #status-log {
            margin-top: 10px;
            font-size: 0.85rem;
            color: #22c55e;
            text-align: center;
        }
    </style>
</head>
<body>

    <h2>Controlo - Canal 1 (Avatar)</h2>

    <div class="section">
        <h3>Motor de Comportamento & Fila</h3>
        <div class="btn-grid">
            <button onclick="triggerCategory('idle')">Modo Idle (Pausa)</button>
            <button onclick="triggerCategory('talking')">Modo Fala (Talking)</button>
            <button class="action-btn" onclick="triggerCategory('reaction')">Disparar Reação (Ênfase)</button>
            <button id="btn-auto" class="auto-btn" onclick="toggleAutoMode()">Ativar Auto-Live Inteligente</button>
        </div>
    </div>

    <div class="section">
        <h3>Ajuste de Escala (Zoom 9:16)</h3>
        <div class="btn-grid">
            <button onclick="setScale(0.9)">Zoom Out (0.9x)</button>
            <button onclick="setScale(1.0)">Normal (1.0x)</button>
            <button onclick="setScale(1.1)">Zoom In (1.1x)</button>
            <button onclick="setScale(1.25)">Zoom Close (1.25x)</button>
        </div>
        <div id="status-log">Sistema pronto.</div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        // Biblioteca exata com os 21 ficheiros validados
        const library = {
            idle: ['idle05.mp4', 'idle06.mp4', 'idle07.mp4', 'idle08.mp4'],
            talking: ['talking01.mp4', 'talking02.mp4', 'talking03.mp4', 'talking04.mp4', 'talking05.mp4', 'talking06.mp4', 'talking07.mp4', 'talking08.mp4'],
            reaction: ['reactions01.mp4', 'reactions02.mp4', 'reactions03.mp4', 'reactions04.mp4', 'reactions05.mp4']
        };

        let lastPlayed = null;
        let isAutoMode = false;
        let autoInterval = null;

        function getRandomAsset(category) {
            const pool = library[category];
            let filtered = pool.filter(item => item !== lastPlayed);
            let selected = filtered[Math.floor(Math.random() * filtered.length)];
            lastPlayed = selected;
            return selected;
        }

        function triggerCategory(category) {
            const chosenVideo = getRandomAsset(category);
            socket.emit('control-avatar', { video: chosenVideo });
            document.getElementById('status-log').innerText = `A reproduzir [${category}]: ${chosenVideo}`;
        }

        function setScale(scaleValue) {
            socket.emit('control-avatar', { scale: scaleValue });
            document.getElementById('status-log').innerText = `Escala ajustada para: ${scaleValue}x`;
        }

        function toggleAutoMode() {
            isAutoMode = !isAutoMode;
            const btn = document.getElementById('btn-auto');
            
            if (isAutoMode) {
                btn.classList.add('active');
                btn.innerText = 'Desativar Auto-Live';
                document.getElementById('status-log').innerText = 'Auto-Live Ativo (Prioridade Talking / Pausas em Idle)';
                
                // Inicia priorizando a fala fluida
                triggerCategory('talking');
                
                // Ciclo inteligente: 70% das vezes foca em falar, nas pausas insere idle ou uma reação pontual
                autoInterval = setInterval(() => {
                    let rand = Math.random();
                    let nextCat = 'talking';
                    
                    if (rand > 0.75) {
                        nextCat = 'idle'; // Pausa natural
                    } else if (rand > 0.90) {
                        nextCat = 'reaction'; // Ênfase pontual
                    }
                    
                    triggerCategory(nextCat);
                }, 9000); // Respeita a duração padrão de cada bloco de vídeo (~9s)
            } else {
                btn.classList.remove('active');
                btn.innerText = 'Ativar Auto-Live Inteligente';
                document.getElementById('status-log').innerText = 'Auto-Live Pausado';
                clearInterval(autoInterval);
            }
        }
    </script>
</body>
</html>
