<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Controlo - Avatar TikTok Shop</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background-color: #121212; 
            color: #ffffff; 
            margin: 0; 
            padding: 20px; 
        }
        h1 { font-size: 22px; color: #00ffcc; text-align: center; }
        .monitor-box { 
            background: #1e1e1e; 
            border: 2px solid #00ffcc; 
            padding: 15px; 
            border-radius: 8px; 
            margin-bottom: 20px; 
            text-align: center; 
        }
        .action-btn { 
            background-color: #ff3366; 
            color: white; 
            border: none; 
            padding: 15px; 
            font-size: 16px; 
            border-radius: 6px; 
            cursor: pointer; 
            width: 100%; 
            font-weight: bold; 
            margin-bottom: 15px; 
            transition: 0.2s;
        }
        .action-btn.active { background-color: #00cc66; }
        
        .box-section {
            background: #1e1e1e;
            border: 1px solid #ffcc00;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .box-section h3 {
            margin-top: 0;
            font-size: 16px;
            color: #ffcc00;
            text-align: center;
        }
        .pip-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }
        .pip-btn {
            background-color: #2a2a2a;
            color: white;
            border: 1px solid #ffcc00;
            padding: 10px;
            font-size: 13px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        .pip-btn:hover { background-color: #ffcc00; color: #000; }

        input[type="file"] {
            width: 100%;
            padding: 10px;
            background: #2a2a2a;
            color: #fff;
            border: 1px dashed #00ffcc;
            border-radius: 6px;
            margin-bottom: 10px;
            box-sizing: border-box;
            cursor: pointer;
        }
        .audio-playlist {
            max-height: 150px;
            overflow-y: auto;
            background: #121212;
            border: 1px solid #444;
            border-radius: 6px;
            padding: 8px;
            margin-bottom: 10px;
        }
        .audio-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 10px;
            border-bottom: 1px solid #222;
            font-size: 13px;
        }
        .audio-item span { color: #00ffcc; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 60%; }
        .play-audio-btn {
            background: #00cc66;
            color: #000;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }
        .play-audio-btn:hover { background: #00ffcc; }

        details { 
            background: #1e1e1e; 
            border: 1px solid #444; 
            border-radius: 8px; 
            padding: 15px; 
            margin-bottom: 20px; 
        }
        summary { font-size: 16px; font-weight: bold; color: #ffcc00; cursor: pointer; }
        .takes-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 15px; }
        .take-btn { background-color: #2a2a2a; color: white; border: 1px solid #555; padding: 12px; font-size: 14px; border-radius: 6px; cursor: pointer; }
        .take-btn:hover { background-color: #00ffcc; color: #000; font-weight: bold; }
    </style>
</head>
<body>

    <h1>Painel de Controlo - Avatar Autónomo</h1>

    <div class="monitor-box">
        <p><strong>A a Rodar:</strong> <span id="current-playing" style="color: #00ffcc;">Nenhum</span></p>
        <p><strong>Próximo na Fila:</strong> <span id="next-queue" style="color: #ffcc00;">Aguardando...</span></p>
        <p><strong>Latência de Transição:</strong> <span id="latency-display" style="color: #ff3366;">0 ms</span></p>
    </div>

    <button id="btn-autolive" class="action-btn" onclick="toggleAutoLive()">🟢 Ligar Auto-Live (Talking Contínuo)</button>

    <div class="box-section">
        <h3>📐 Controlo de Tamanho do Avatar (PIP)</h3>
        <div class="pip-grid">
            <button class="pip-btn" onclick="changeScale('escala-full')">Ecrã Inteiro</button>
            <button class="pip-btn" onclick="changeScale('escala-pip-medio')">PIP Médio</button>
            <button class="pip-btn" onclick="changeScale('escala-pip-pequeno')">PIP Pequeno</button>
        </div>
    </div>

    <div class="box-section">
        <h3>🎙️ Gestor de Roteiros e Fila de Áudio (MP3)</h3>
        <input type="file" id="audioUpload" accept="audio/mp3, audio/mpeg" multiple onchange="handleAudioUpload(this)">
        <div class="audio-playlist" id="audioPlaylistContainer">
            <p style="color: #888; text-align: center; font-size: 13px; margin: 10px 0;">Nenhum áudio carregado. Selecione os MP3 acima.</p>
        </div>
    </div>

    <details>
        <summary>📁 Gestão e Teste Individual de Takes (01 a 11)</summary>
        <div class="takes-grid" id="takes-container"></div>
    </details>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let autoLiveActive = false;
        let audioPlaylist = [];

        const talkingFiles = [
            'talking01.mp4', 'talking02.mp4', 'talking03.mp4', 'talking04.mp4',
            'talking05.mp4', 'talking06.mp4', 'talking07.mp4', 'talking08.mp4',
            'talking09.mp4', 'talking10.mp4', 'talking11.mp4'
        ];

        let queue = [];

        const container = document.getElementById('takes-container');
        talkingFiles.forEach((file, index) => {
            const num = index + 1;
            const btn = document.createElement('button');
            btn.className = 'take-btn';
            btn.innerText = `Take ${num < 10 ? '0' + num : num}`;
            btn.onclick = () => playManual(file);
            container.appendChild(btn);
        });

        function shuffleQueue() {
            queue = [...talkingFiles].sort(() => Math.random() - 0.5);
        }

        function playManual(filename) {
            socket.emit('trigger-video', filename);
            document.getElementById('current-playing').innerText = filename + " (Manual)";
        }

        function changeScale(scaleClass) {
            socket.emit('change-scale', scaleClass);
        }

        function handleAudioUpload(input) {
            const files = input.files;
            if (!files.length) return;

            for (let file of files) {
                const audioUrl = URL.createObjectURL(file);
                audioPlaylist.push({
                    name: file.name,
                    url: audioUrl
                });
            }
            renderPlaylist();
        }

        function renderPlaylist() {
            const playlistContainer = document.getElementById('audioPlaylistContainer');
            if (audioPlaylist.length === 0) {
                playlistContainer.innerHTML = `<p style="color: #888; text-align: center; font-size: 13px; margin: 10px 0;">Nenhum áudio carregado.</p>`;
                return;
            }

            playlistContainer.innerHTML = '';
            audioPlaylist.forEach((audioItem, index) => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'audio-item';
                itemDiv.innerHTML = `
                    <span>${index + 1}. ${audioItem.name}</span>
                    <button class="play-audio-btn" onclick="playAudioItem(${index})">▶ Tocar</button>
                `;
                playlistContainer.appendChild(itemDiv);
            });
        }

        function playAudioItem(index) {
            const audioObj = audioPlaylist[index];
            if (audioObj) {
                socket.emit('play-audio-item', { name: audioObj.name, url: audioObj.url });
                document.getElementById('current-playing').innerText = `Áudio: ${audioObj.name}`;
            }
        }

        function toggleAutoLive() {
            autoLiveActive = !autoLiveActive;
            const btn = document.getElementById('btn-autolive');

            if (autoLiveActive) {
                btn.classList.add('active');
                btn.innerText = "🔴 Desligar Auto-Live";
                shuffleQueue();
                runAutoLiveLoop();
            } else {
                btn.classList.remove('active');
                btn.innerText = "🟢 Ligar Auto-Live (Talking Contínuo)";
                document.getElementById('next-queue').innerText = "Pausado";
            }
        }

        function runAutoLiveLoop() {
            if (!autoLiveActive) return;
            if (queue.length === 0) shuffleQueue();

            const nextFile = queue.shift();
            const upcomingFile = queue[0] || talkingFiles[0];

            socket.emit('trigger-video', nextFile);
            document.getElementById('current-playing').innerText = nextFile;
            document.getElementById('next-queue').innerText = upcomingFile;
        }

        socket.on('next-auto-video', () => {
            if (autoLiveActive) {
                runAutoLiveLoop();
            }
        });

        socket.on('video-switched-ack', (data) => {
            document.getElementById('latency-display').innerText = data.latency + " ms";
        });
    </script>
</body>
</html>
