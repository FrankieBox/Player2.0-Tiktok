<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Controlo - Canal 1 (Avatar)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #fff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h2 { color: #00ffcc; text-align: center; }
        .section {
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            width: 100%;
            max-width: 400px;
        }
        h3 { font-size: 1rem; color: #38bdf8; margin-top: 0; }
        .btn-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        button {
            background-color: #334155;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover { background-color: #00ffcc; color: #000; }
        button.action-btn { background-color: #6200ee; grid-column: span 2; }
        button.action-btn:hover { background-color: #bb86fc; color: #000; }
        button.auto-btn { background-color: #0d9488; grid-column: span 2; }
        button.auto-btn.active { background-color: #ef4444; }
        #status-log {
            margin-top: 10px;
            font-size: 0.85rem;
            color: #22c55e;
            text-align: center;
        }
    </style>
</head>
<body>

    <h2>Controlo - Canal 1 (Avatar)</h2>

    <div class="section">
        <h3>Motor de Comportamento & Fila</h3>
        <div class="btn-grid">
            <button onclick="triggerCategory('idle')">Modo Idle</button>
            <button onclick="triggerCategory('talking')">Modo Fala</button>
            <button class="action-btn" onclick="triggerCategory('reaction')">Disparar Reação</button>
            <button id="btn-auto" class="auto-btn" onclick="toggleAutoMode()">Ativar Auto-Live (Fila Contínua)</button>
        </div>
    </div>

    <div class="section">
        <h3>Ajuste de Escala (Zoom 9:16)</h3>
        <div class="btn-grid">
            <button onclick="setScale(0.9)">Zoom Out (0.9x)</button>
            <button onclick="setScale(1.0)">Normal (1.0x)</button>
            <button onclick="setScale(1.1)">Zoom In (1.1x)</button>
            <button onclick="setScale(1.25)">Zoom Close (1.25x)</button>
        </div>
        <div id="status-log">Sistema pronto.</div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        const library = {
            idle: ['idle05.mp4', 'idle06.mp4', 'idle07.mp4', 'idle08.mp4'],
            talking: ['talking01.mp4', 'talking02.mp4', 'talking03.mp4', 'talking04.mp4', 'talking05.mp4', 'talking06.mp4', 'talking07.mp4', 'talking08.mp4'],
            reaction: ['reactions01.mp4', 'reactions02.mp4', 'reactions03.mp4', 'reactions04.mp4', 'reactions05.mp4']
        };

        let lastPlayed = null;
        let isAutoMode = false;
        let autoInterval = null;

        function getRandomAsset(category) {
            const pool = library[category];
            let filtered = pool.filter(item => item !== lastPlayed);
            let selected = filtered[Math.floor(Math.random() * filtered.length)];
            lastPlayed = selected;
            return selected;
        }

        function triggerCategory(category) {
            const chosenVideo = getRandomAsset(category);
            socket.emit('control-avatar', { video: chosenVideo });
            document.getElementById('status-log').innerText = `A reproduzir [${category}]: ${chosenVideo}`;
        }

        function setScale(scaleValue) {
            socket.emit('control-avatar', { scale: scaleValue });
            document.getElementById('status-log').innerText = `Escala ajustada para: ${scaleValue}x`;
        }

        function toggleAutoMode() {
            isAutoMode = !isAutoMode;
            const btn = document.getElementById('btn-auto');
            
            if (isAutoMode) {
                btn.classList.add('active');
                btn.innerText = 'Desativar Auto-Live';
                document.getElementById('status-log').innerText = 'Modo Auto-Live Ativo (Fila de 9s)';
                
                // Inicia o ciclo automático alternando entre idle e talking
                triggerCategory('idle');
                autoInterval = setInterval(() => {
                    let nextCat = Math.random() > 0.3 ? 'talking' : 'idle';
                    triggerCategory(nextCat);
                }, 9000); // Roda um vídeo a cada 9 segundos em loop inteligente
            } else {
                btn.classList.remove('active');
                btn.innerText = 'Ativar Auto-Live (Fila Contínua)';
                document.getElementById('status-log').innerText = 'Modo Auto-Live Pausado';
                clearInterval(autoInterval);
            }
        }

        // Ouve o sinal do display quando o vídeo acaba para manter a fila se desejado
        socket.on('auto-next', () => {
            if (isAutoMode) {
                triggerCategory('idle');
            }
        });
    </script>
</body>
</html>
