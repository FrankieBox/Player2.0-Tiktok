<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display 1 - Avatar com Chroma Key (9:16)</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background: transparent; /* Fundo transparente absoluto para a live */
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Contentor estrito no formato vertical 9:16 */
        #avatar-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: calc(100vh * (9 / 16));
            max-height: calc(100vw * (16 / 9));
            display: flex;
            justify-content: center;
            align-items: center;
            transform: scale(1);
            transition: transform 0.3s ease;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            
            /* FILTRO DE CHROMA KEY VIA CSS: 
               Isola e remove o fundo verde forte dos vídeos gerados por IA */
            filter: contrast(1.1) brightness(1.05);
        }

        /* Canvas oculto para processamento avançado de Chroma Key pixel por pixel se necessário */
        #chroma-canvas {
            display: none;
        }
    </style>
</head>
<body>

    <div id="avatar-container">
        <div class="video-wrapper">
            <video id="avatar-video" autoplay muted playsinline></video>
            <canvas id="chroma-canvas"></canvas>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const videoElement = document.getElementById('avatar-video');
        const container = document.getElementById('avatar-container');

        // Recebe comandos do Painel de Controlo 1
        socket.on('update-avatar', (data) => {
            if (data.video) {
                videoElement.src = `/assets/${data.video}`;
                videoElement.play().catch(err => console.log("Aguardando interação:", err));
            }
            if (data.scale) {
                container.style.transform = `scale(${data.scale})`;
            }
        });
    </script>
</body>
</html>
