<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Controlo - Canal 1 (Isolado)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #fff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h2 { color: #00ffcc; text-align: center; }
        .section {
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            width: 100%;
            max-width: 400px;
        }
        h3 { font-size: 1rem; color: #38bdf8; margin-top: 0; }
        .btn-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        button {
            background-color: #334155;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover { background-color: #00ffcc; color: #000; }
        button.action-btn { background-color: #6200ee; grid-column: span 2; }
        button.action-btn:hover { background-color: #bb86fc; color: #000; }
        button.auto-btn { background-color: #0d9488; grid-column: span 2; }
        button.auto-btn.active { background-color: #ef4444; }
        
        .slider-group {
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .slider-group label { font-size: 0.85rem; color: #cbd5e1; }
        .slider-group input[type=range] { width: 100%; cursor: pointer; }
        .slider-value { color: #38bdf8; font-weight: bold; text-align: right; }

        .monitor-box {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            padding: 10px;
            margin-top: 10px;
            font-size: 0.9rem;
        }
        .monitor-box p { margin: 5px 0; }
        .highlight { color: #38bdf8; font-weight: bold; }
        .next-highlight { color: #facc15; font-weight: bold; }
        .sensor-highlight { color: #ef4444; font-weight: bold; }
    </style>
</head>
<body>

    <h2>Controlo - Canal 1 (Auto-Live Estrito)</h2>

    <div class="section">
        <h3>Motor de Comportamento & Fila</h3>
        <div class="btn-grid">
            <button onclick="triggerCategory('idle')">Modo Idle (Manual)</button>
            <button onclick="triggerCategory('talking')">Disparar Fala Única</button>
            <button class="action-btn" onclick="triggerCategory('reaction')">Disparar Reação (Manual)</button>
            <button id="btn-auto" class="auto-btn" onclick="toggleAutoMode()">Ativar Auto-Live (Só Talking)</button>
        </div>

        <div class="slider-group">
            <label for="interval-slider">Intervalo de Troca (Auto-Live): <span id="slider-val" class="slider-value">9.0</span>s</label>
            <input type="range" id="interval-slider" min="5" max="9" step="0.5" value="9" oninput="updateInterval(this.value)">
        </div>

        <!-- Monitor e Sensor de Latência -->
        <div class="monitor-box">
            <p>🔴 A Rodar Agora: <span id="current-playing" class="highlight">Nenhum</span></p>
            <p>⏭️ Próximo na Fila: <span id="next-queued" class="next-highlight">Nenhum</span></p>
            <p>⚡ Latência de Resposta: <span id="latency-sensor" class="sensor-highlight">0 ms</span></p>
        </div>
    </div>

    <div class="section">
        <h3>Ajuste de Escala (Zoom 9:16)</h3>
        <div class="btn-grid">
            <button onclick="setScale(0.9)">Zoom Out (0.9x)</button>
            <button onclick="setScale(1.0)">Normal (1.0x)</button>
            <button onclick="setScale(1.1)">Zoom In (1.1x)</button>
            <button onclick="setScale(1.25)">Zoom Close (1.25x)</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        // Biblioteca isolada por categorias estritas
        const library = {
            idle: ['idle05.mp4', 'idle06.mp4', 'idle07.mp4', 'idle08.mp4'],
            talking: ['talking02.mp4', 'talking04.mp4', 'talking05.mp4', 'talking06.mp4'],
            reaction: ['reactions01.mp4', 'reactions02.mp4', 'reactions03.mp4', 'reactions04.mp4', 'reactions05.mp4']
        };

        let lastPlayed = null;
        let nextInQueue = null;
        let isAutoMode = false;
        let autoInterval = null;
        let currentIntervalSeconds = 9;
        let sentTimestamp = 0;

        function getNextAsset(category) {
            const pool = library[category];
            let selected = nextInQueue || pool.filter(item => item !== lastPlayed)[Math.floor(Math.random() * pool.length)];
            
            let remaining = pool.filter(item => item !== selected);
            nextInQueue = remaining[Math.floor(Math.random() * remaining.length)];

            lastPlayed = selected;
            
            document.getElementById('current-playing').innerText = selected;
            document.getElementById('next-queued').innerText = nextInQueue;

            return selected;
        }

        function triggerCategory(category) {
            const chosenVideo = getNextAsset(category);
            sentTimestamp = performance.now();
            socket.emit('control-avatar', { video: chosenVideo });
        }

        function setScale(scaleValue) {
            socket.emit('control-avatar', { scale: scaleValue });
        }

        function updateInterval(val) {
            currentIntervalSeconds = parseFloat(val);
            document.getElementById('slider-val').innerText = currentIntervalSeconds.toFixed(1);
            if (isAutoMode) {
                clearInterval(autoInterval);
                startAutoLoop();
            }
        }

        function startAutoLoop() {
            // LOOP AUTOMÁTICO RESTRITO EXCLUSIVAMENTE A 'talking'
            autoInterval = setInterval(() => {
                triggerCategory('talking');
            }, currentIntervalSeconds * 1000);
        }

        function toggleAutoMode() {
            isAutoMode = !isAutoMode;
            const btn = document.getElementById('btn-auto');
            
            if (isAutoMode) {
                btn.classList.add('active');
                btn.innerText = 'Desativar Auto-Live';
                
                // Dispara imediatamente o primeiro talking e inicia o loop exclusivo
                triggerCategory('talking');
                startAutoLoop();
            } else {
                btn.classList.remove('active');
                btn.innerText = 'Ativar Auto-Live (Só Talking)';
                clearInterval(autoInterval);
                document.getElementById('current-playing').innerText = 'Pausado';
                document.getElementById('next-queued').innerText = 'Nenhum';
            }
        }

        // Recebe o retorno do sensor de latência do display
        socket.on('sensor-ack', () => {
            if (sentTimestamp > 0) {
                let durationMs = Math.round(performance.now() - sentTimestamp);
                document.getElementById('latency-sensor').innerText = `${durationMs} ms`;
                sentTimestamp = 0;
            }
        });
    </script>
</body>
</html>
